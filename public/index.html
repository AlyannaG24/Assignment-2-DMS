<!DOCTYPE html>
<html>
    
    <head>
    <title>Icon Template Square</title>
        <style>
            .row{
                width:720px;
                margin: 10px auto 10px auto ;
            }
            .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
            }
        </style>
    </head>

    <body>

        <div class="row">
            <div class="image-container"><img id="bedroom_1_id" src="img/bedroom_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="childhood_1_id" src="img/childhood_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="wish_1_id"src="img/wish_1.png" height="200" width="200"/></div>
        </div>

        <div class="row">
            <div class="image-container"><img id="inventory_1_id" src="img/inventory_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="settings_1_id" src="img/settings_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="puzzle_1_id" src="img/puzzle_1.png" height="200" width="200"/></div>
            </div>

        <div class="row">
            <div class="image-container"><img id="memory_1_id" src="img/memory_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="sleep_1_id" src="img/sleep_1.png" height="200" width="200"/></div>
            <div class="image-container"><img id="story_1_id" src="img/story_1.png" height="200" width="200"/></div>
        </div>
        
    </body>
    
</html>

<script>
     const bedroom_1_el = document.getElementById ('bedroom_1_id')
    const bedroom_sound = new Audio ('sounds/bedroom_sound_01.mp3')
    bedroom_1_el.onpointerdown = () => {
        bedroom_1_el.src = 'img/bedroom_2.png'
        bedroom_sound.play ()
        setTimeout (() => {
            bedroom_1_el.src = 'img/bedroom_1.png'
        }, 1000)
    }
</script>
